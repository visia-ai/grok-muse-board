  const LOCAL_KEY = "study-plan-checks-v4";

  function todayStr() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: PLAN.timezone,
      year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }
  function normalizeDay(raw) {
    const out = {};
    if (!raw || typeof raw !== "object") return out;
    for (const [k, v] of Object.entries(raw)) {
      if (v && typeof v === "object" && "on" in v) {
        out[k] = { on: !!v.on, t: Number(v.t) || 0 };
      } else {
        out[k] = { on: !!v, t: 0 };
      }
    }
    return out;
  }
  function loadLocal() {
    try {
      const all = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");
      const out = {};
      for (const [day, rec] of Object.entries(all)) out[day] = normalizeDay(rec);
      return out;
    } catch (e) { return {}; }
  }
  function saveLocal(all) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
  }
  function mergeStates(a, b) {
    const out = JSON.parse(JSON.stringify(a || {}));
    for (const [day, rec] of Object.entries(b || {})) {
      if (!out[day]) out[day] = {};
      for (const [k, v] of Object.entries(normalizeDay(rec))) {

  }
  function getSyncKey() {
    const q = new URLSearchParams(location.search).get("k");
    if (q && /^[A-Za-z0-9_-]{12,80}$/.test(q)) {
      try { localStorage.setItem("study-plan-sync-key", q); } catch (e) {}
      return q;
    }
    try {
      const saved = localStorage.getItem("study-plan-sync-key");
      if (saved) return saved;
    } catch (e) {}
    return DEFAULT_SYNC_KEY || "";
  }
  function pageUrl() {
    const k = getSyncKey();
    const base = location.origin && location.origin !== "null" ? location.origin + location.pathname : "";
    if (!base) return "";
    return k ? (base + "?k=" + encodeURIComponent(k)) : base;
  }

  const days = PLAN.days;
  const indexByDate = Object.fromEntries(days.map((d, i) => [d.date, i]));
  let viewDate = todayStr();
  if (!(viewDate in indexByDate)) {
    if (viewDate < PLAN.start) viewDate = PLAN.start;
    else if (viewDate > PLAN.end) viewDate = PLAN.end;
  }
  let checks = loadLocal();
  let syncTimer = 0;
  const syncKey = getSyncKey();
  const canSync = !!(SYNC_ORIGIN && syncKey);

  function setSync(kind, text) {
    const el = document.getElementById("syncLine");
    el.className = "sync " + kind;
    document.getElementById("syncText").textContent = text;
  }

  async function pullRemote() {
    if (!canSync) {
      setSync("", "仅保存在这台设备（刷新不丢）。同一条链接才能在手机和电脑间同步。");
      return;
    }
    setSync("wait", "正在同步…");
    try {
      const r = await fetch(SYNC_ORIGIN + "/api/state?k=" + encodeURIComponent(syncKey), { cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const remote = await r.json();
      checks = mergeStates(checks, remote.checks || remote);
      saveLocal(checks);
      render();
      setSync("ok", "已与云端同步，手机和电脑勾选一致。");
    } catch (e) {
      setSync("err", "云端暂时连不上，勾选已先存在这台设备，刷新不会丢。");
    }
  }
  async function pushRemote() {
    if (!canSync) return;
    try {
      const r = await fetch(SYNC_ORIGIN + "/api/state?k=" + encodeURIComponent(syncKey), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ checks })
      });
      if (!r.ok) throw new Error("http " + r.status);
      const remote = await r.json();
      if (remote && remote.checks) {
        checks = mergeStates(checks, remote.checks);
        saveLocal(checks);
      }
      setSync("ok", "已与云端同步，手机和电脑勾选一致。");
    } catch (e) {
      setSync("err", "这次没同步上，勾选已存在这台设备。稍后会再试。");
    }
  }
  function scheduleSync() {
    if (!canSync) return;
    setSync("wait", "正在保存到云端…");
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushRemote, 250);
  }

  function isOn(day, id) {
    return !!(checks[day] && checks[day][id] && checks[day][id].on);
  }
  function setCheck(day, id, on) {
    if (!checks[day]) checks[day] = {};
    checks[day][id] = { on: !!on, t: Date.now() };
    saveLocal(checks);
    scheduleSync();
  }

  function taskList(day, prefix, tasks) {
    return tasks.map((t, n) => {
      const id = prefix + n;
      const on = isOn(day, id);
      return '<li class="' + (on ? "done" : "") + '">' +
        '<input type="checkbox" id="' + day + "-" + id + '" data-day="' + day + '" data-k="' + id + '"' + (on ? " checked" : "") + ">" +
        '<label for="' + day + "-" + id + '">' + escapeHtml(t) + "</label></li>";
    }).join("");
  }
  function countDone(day, prefix, tasks) {
    return tasks.filter((_, n) => isOn(day, prefix + n)).length;
  }
  function badgeFor(kind) {
    if (kind === "rest") return '<div class="badge rest">休息日</div>';
    if (kind === "review") return '<div class="badge">考前轻复习</div>';
    if (kind === "exam") return '<div class="badge exam">考试日</div>';
    if (kind === "light") return '<div class="badge">较轻的一天</div>';
    return '<div class="badge">今天这一块</div>';
  }

  function render() {
    const i = indexByDate[viewDate];
    const day = days[i];
    const isToday = viewDate === todayStr();
    const mock = day.cet4 && (day.cet4.theme || "").indexOf("模考") >= 0;
    document.getElementById("dateLine").textContent =
      day.date + "  " + day.weekday + (isToday ? "  ·  今天" : "") +
      (mock ? "  ·  四级模考 9:00，课程可选后移" : "  ·  上午 10:00");

    const res = day.resource ? '<div class="resource">' + escapeHtml(day.resource) + "</div>" : "";
    let html = '<div class="card">' + badgeFor(day.kind) +
      '<div class="course">' + escapeHtml(day.course) + "</div>" + res +
      '<div class="block"><b>今天看：</b>' + escapeHtml(day.watch) + "</div>" +
      '<div class="block"><b>目标：</b>' + escapeHtml(day.target) + "</div>" +
      '<ul class="tasks">' + taskList(day.date, "m", day.tasks) + "</ul>" +
      '<div class="progress" data-progress="m">已完成 ' + countDone(day.date, "m", day.tasks) + " / " + day.tasks.length + "</div></div>";

    if (day.cet4) {
      const c = day.cet4;
      const eve = c.optional_evening;
      html += '<div class="card cet-card">' +
        '<div class="badge cet">四级 · ' + escapeHtml(c.theme || "短块") + "</div>" +
        '<div class="course">大学英语四级</div>' +
        (c.note ? '<div class="note">' + escapeHtml(c.note) + "</div>" : "") +
        '<div class="block"><b>今天练：</b>' + escapeHtml(c.watch) + "</div>" +
        '<div class="block"><b>目标：</b>' + escapeHtml(c.target) + "</div>" +
        '<ul class="tasks">' + taskList(day.date, "c", c.tasks) + "</ul>" +
        '<div class="progress" data-progress="c">已完成 ' + countDone(day.date, "c", c.tasks) + " / " + c.tasks.length + "</div>";
      if (eve) {
        html += '<div class="block" style="margin-top:16px"><b>晚上巩固（可选）：</b>' + escapeHtml(eve.watch) + "</div>" +
          '<ul class="tasks">' + taskList(day.date, "e", eve.tasks) + "</ul>" +
          '<div class="progress" data-progress="e">可选已完成 ' + countDone(day.date, "e", eve.tasks) + " / " + eve.tasks.length + "</div>";
      }
      if (PLAN.cet4_exam_tips && PLAN.cet4_exam_tips.length) {
        html += '<div class="tips">场考保命：' + PLAN.cet4_exam_tips.map(escapeHtml).join("；") + "</div>";
      }
      html += "</div>";
    }
    document.getElementById("cards").innerHTML = html;
    document.getElementById("prevBtn").disabled = i <= 0;
    document.getElementById("nextBtn").disabled = i >= days.length - 1;
  }

  document.getElementById("cards").addEventListener("change", ev => {
    const el = ev.target;
    if (!el || el.type !== "checkbox") return;
    const day = el.getAttribute("data-day");
    const id = el.getAttribute("data-k");
    setCheck(day, id, el.checked);
    const li = el.closest("li");
    if (li) li.classList.toggle("done", el.checked);
    const prefix = id.charAt(0);
    const d = days[indexByDate[day]];
    const tasks = prefix === "m" ? d.tasks : (prefix === "e" ? (d.cet4 && d.cet4.optional_evening && d.cet4.optional_evening.tasks) || [] : (d.cet4 && d.cet4.tasks) || []);
    const bar = el.closest(".card").querySelector('[data-progress="' + prefix + '"]');
    if (bar) {
      const label = prefix === "e" ? "可选已完成 " : "已完成 ";
      bar.textContent = label + countDone(day, prefix, tasks) + " / " + tasks.length;
    }
  });

  document.getElementById("prevBtn").onclick = () => {
    const i = indexByDate[viewDate];
    if (i > 0) { viewDate = days[i - 1].date; render(); }
  };
  document.getElementById("nextBtn").onclick = () => {
    const i = indexByDate[viewDate];
    if (i < days.length - 1) { viewDate = days[i + 1].date; render(); }
  };
  document.getElementById("todayBtn").onclick = () => {
    viewDate = todayStr();
    if (!(viewDate in indexByDate)) {
      if (viewDate < PLAN.start) viewDate = PLAN.start;
      else if (viewDate > PLAN.end) viewDate = PLAN.end;
    }
    render();
  };
  document.getElementById("copyBtn").onclick = async () => {
    const url = pageUrl();
    if (!url) { setSync("err", "请用网上的那条链接打开，才能复制给手机。"); return; }
    try {
      await navigator.clipboard.writeText(url);
      setSync("ok", "链接已复制，发给手机打开即可同步勾选。");
    } catch (e) {
      window.prompt("复制这条链接到手机打开：", url);
    }
  };

  render();
  pullRemote();
  </script>
</body>
</html>
